<title id="title">Refund request paths</title><desc id="desc">Request: identify user · load order; Eligibility check: code: window · amount; Approval check: auto if ≤ $50, else lead; Explain refusal: not eligible is a valid end; Reconcile op-42: look up before retrying; Issue refund: with operation ID op-42; Confirm to customer: receipt R-981. Connections: request to eligible; eligible to approve (eligible); eligible to explain (not eligible); approve to issue (approved / auto); issue to reconcile (timeout); issue to done (receipt); reconcile to done (found)</desc>
