<title id="title">How the parts connect</title><desc id="desc">API gateway: identity · quotas; Context builder: permitted information; Orchestrator: loop · state · limits; Model gateway: choose model · fallback; Durable store: tasks · actions taken; Tool gateway: check · authorize; Services: own business rules. Connections: api to orch (request); context to orch (context); orch to model (prompt); model to orch (decision); orch to store (save); orch to tools (proposed call); tools to services (allowed call)</desc>
