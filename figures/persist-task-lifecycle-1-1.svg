<svg xmlns="http://www.w3.org/2000/svg" width="694" height="310" viewBox="0 0 694 310" role="img" aria-labelledby="title desc">
<title id="title">Task states</title><desc id="desc">CREATED: accepted and saved; RUNNING: doing one step; WAITING_FOR_TOOL: slow outside call; WAITING_FOR_APPROVAL: a person decides; COMPLETED: outcome checked; WAITING_FOR_USER: asked a question; FAILED / CANCELLED: or HANDED_OFF · reason kept. Connections: created to running (start); running to tool (call); tool to running (result); running to approval (pause); approval to running (decided); running to user (ask); running to done (verified); running to failed (error)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9bc4ad" stroke-width="1.6"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c99a78" stroke-width="1.6"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="#1b201d"/>
