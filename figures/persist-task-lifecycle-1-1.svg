l="#e4ebe4">WAITING_FOR_TOOL</text><text x="347.2" y="63.0" text-anchor="middle" font-size="11" font-weight="400" fill="#b0bcb2">slow outside call</text><rect x="263.2" y="234" width="168" height="58" rx="9" fill="#242b27" stroke="#4c5b51"/><text x="347.2" y="256.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e4ebe4">WAITING_FOR_APPROVAL</text><text x="347.2" y="279.0" text-anchor="middle" font-size="11" font-weight="400" fill="#b0bcb2">a person decides</text><rect x="508.4" y="126" width="168" height="58" rx="9" fill="#24382b" stroke="#6fa27e"/><text x="592.4" y="148.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e4ebe4">COMPLETED</text><text x="592.4" y="171.0" text-anchor="middle" font-size="11" font-weight="400" fill="#b0bcb2">outcome checked</text><rect x="18.0" y="234" width="168" height="58" rx="9" fill="#242b27" stroke="#4c5b51"/><text x="102.0" y="256.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e4ebe4">WAITING_FOR_USER</text><text x="102.0" y="279.0" text-anchor="middle" font-size="11" font-weight="400" fill="#b0bcb2">asked a question</text><rect x="508.4" y="234" width="168" height="58" rx="9" fill="#3a2b25" stroke="#b48869"/><text x="592.4" y="256.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e4ebe4">FAILED / CANCELLED</text><text x="592.4" y="279.0" text-anchor="middle" font-size="11" font-weight="400" fill="#b0bcb2">or HANDED_OFF · reason kept</text><rect x="203.8" y="136.0" width="41.5" height="16" rx="4" fill="#1b201d"/><text x="224.6" y="148.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#abb6ae">start</text><rect x="365.2" y="94.0" width="35.6" height="16" rx="4" fill="#1b201d"/><text x="383.0" y="106.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#abb6ae">call</text><rect x="281.8" y="94.0" width="47.4" height="16" rx="4" fill="#1b201d"/><text x="305.5" y="106.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#abb6ae">result</t