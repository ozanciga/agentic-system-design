<title id="title">A 20-second task budget</title><desc id="desc">Task: 0 to 2 s queue, 2 to 5 s context, 5 to 11 s model, 11 to 15 s tools, 15 to 17 s verify, 17 to 20 s reserve. Markers: last start at 17 s, deadline at 20 s</desc>
