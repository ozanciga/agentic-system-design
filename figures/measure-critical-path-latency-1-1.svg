<svg xmlns="http://www.w3.org/2000/svg" width="692" height="154" viewBox="0 0 692 154" role="img" aria-labelledby="title desc">
<title id="title">One task, reads in sequence vs. in parallel</title><desc id="desc">In sequence: 0 to 1 s queue, 1 to 3 s read A, 3 to 7 s read B, 7 to 11 s model, 11 to 12 s check; Parallel, branch 1: 0 to 1 s queue, 1 to 3 s read A; Parallel, branch 2: 1 to 5 s read B, 5 to 9 s model, 9 to 10 s check. Markers: parallel at 10 s, sequence at 12 s</desc>
